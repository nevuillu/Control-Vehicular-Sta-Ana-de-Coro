<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control Vehicular — Residencia Santa Ana</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-2: #273549;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 80px; }
    header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border); padding: 14px 16px;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.15rem; }
    .sub { font-size: 0.8rem; color: var(--muted); }
    .btn {
      border: none; border-radius: 8px; padding: 9px 13px; font-weight: 600;
      cursor: pointer; font-size: 0.88rem; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: var(--accent); color: #082f49; }
    .btn-success { background: var(--ok); color: #052e16; }
    .btn-warn { background: var(--warn); color: #271500; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
    .mode-pill {
      font-size: 0.76rem; padding: 4px 10px; border-radius: 999px; font-weight: 700;
      border: 1px solid var(--border); background: var(--card-2); color: var(--muted);
    }
    .mode-pill.unlocked {
      background: rgba(34, 197, 94, 0.16); color: #86efac; border-color: rgba(34, 197, 94, 0.45);
    }
    .container { max-width: 980px; margin: 16px auto; padding: 0 16px; }
    .search-box {
      width: 100%; padding: 13px 15px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
      font-size: 1rem; margin-bottom: 12px;
    }
    .search-box:focus { outline: 2px solid var(--accent); border-color: transparent; }
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; }
    .tab {
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      padding: 7px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; font-size: 0.84rem;
    }
    .tab.active { background: var(--accent); color: #082f49; font-weight: 700; border-color: var(--accent); }
    .stats { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.84rem; color: var(--muted); margin-bottom: 14px; align-items: center; }
    .alert-unregistered {
      background: rgba(239, 68, 68, 0.12); border: 1px solid var(--danger);
      color: #fecaca; padding: 18px; border-radius: 12px; text-align: center; margin-top: 12px;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    }
    .badge {
      display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 3px 8px;
      border-radius: 6px; background: var(--card-2); color: var(--accent);
    }
    .placa { font-size: 1.15rem; font-weight: 800; letter-spacing: 0.5px; color: #fff; }
    .meta { font-size: 0.88rem; color: #e2e8f0; line-height: 1.45; }
    .meta span { color: var(--muted); }
    .multi-box {
      margin-top: 8px; background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.35); border-radius: 9px; padding: 8px;
    }
    .multi-toggle {
      width: 100%; background: rgba(245, 158, 11, 0.16); color: #fde68a;
      border: 1px solid rgba(245, 158, 11, 0.45); border-radius: 7px;
      padding: 6px 9px; font-size: 0.79rem; font-weight: 700;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .multi-list { display: none; margin-top: 8px; display: none; flex-direction: column; gap: 6px; }
    .multi-list.open { display: flex; }
    .multi-item {
      background: var(--bg); border: 1px solid var(--border); border-radius: 7px;
      padding: 7px 9px; font-size: 0.8rem; display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .multi-item-sub { color: var(--muted); font-size: 0.75rem; }
    .mini-actions { display: flex; gap: 5px; flex-shrink: 0; }
    .mini-btn {
      border: none; border-radius: 6px; padding: 4px 7px; font-size: 0.72rem;
      font-weight: 700; cursor: pointer;
    }
    .actions { display: flex; gap: 8px; margin-top: 6px; }
    .actions button { flex: 1; padding: 7px 10px; font-size: 0.8rem; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      width: 100%; max-width: 480px; padding: 20px; max-height: 92vh; overflow-y: auto;
    }
    .form-group { margin-bottom: 11px; }
    label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
    input, select {
      width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 0.92rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <div>
        <h1>Control Vehicular — Santa Ana</h1>
        <div class="sub" id="syncStatus">Conectando con base de datos...</div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <span id="editModeBadge" class="mode-pill">Modo consulta</span>
        <button class="btn btn-ghost" id="toggleEditBtn" onclick="toggleModoEdicion()">Desbloquear PIN</button>
        <button class="btn btn-primary" onclick="solicitarNuevo()">+ Nuevo</button>
        <button class="btn btn-ghost" onclick="solicitarCenso()">Cargar Censo (87)</button>
      </div>
    </div>
  </header>

  <div class="container">
    <input
      type="search"
      id="searchInput"
      class="search-box"
      placeholder="Buscar por placa, marca/modelo, apto (ej. 1406), vecino o teléfono..."
      oninput="renderizar()"
    />

    <div class="tabs">
      <button class="tab active" data-tab="todos" onclick="cambiarTab('todos', this)">Todos</button>
      <button class="tab" data-tab="carro" onclick="cambiarTab('carro', this)">Carros / Camionetas</button>
      <button class="tab" data-tab="moto" onclick="cambiarTab('moto', this)">Motos</button>
      <button class="tab" data-tab="multi" onclick="cambiarTab('multi', this)">+1 Vehículo</button>
      <button class="tab" data-tab="mixto" onclick="cambiarTab('mixto', this)">Carro y Moto</button>
    </div>

    <div class="stats" id="statsBar"></div>
    <div id="resultsContainer"></div>
  </div>

  <!-- Modal PIN para Agregar / Editar / Eliminar -->
  <div class="modal-backdrop" id="pinModal">
    <div class="modal" style="max-width:350px; text-align:center;">
      <h3 style="margin-top:0;">PIN de Edición</h3>
      <p class="sub" style="margin-bottom:12px;">Ingresa el PIN autorizado para agregar, editar o eliminar registros.</p>
      <input type="password" id="editPinInput" placeholder="PIN" style="text-align:center; margin-bottom:10px;" />
      <p id="editPinError" style="color:var(--danger); font-size:0.82rem; margin:4px 0 10px;"></p>
      <div class="actions">
        <button type="button" class="btn btn-ghost" onclick="cerrarPinModal()">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="confirmarPinEdicion()">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Modal Agregar / Editar -->
  <div class="modal-backdrop" id="formModal">
    <div class="modal">
      <h3 id="modalTitle" style="margin-top:0;">Registrar vehículo</h3>
      <form onsubmit="guardarVehiculo(event)">
        <input type="hidden" id="docId" />
        <div class="form-group">
          <label>Apartamento / Piso</label>
          <input type="text" id="fApto" required placeholder="Ej. 1406 o 3" />
        </div>
        <div class="form-group">
          <label>Nombre del Copropietario</label>
          <input type="text" id="fPropietario" required placeholder="Ej. Henry Garcia" />
        </div>
        <div class="form-group">
          <label>Tipo de Vehículo</label>
          <select id="fTipo" required>
            <option value="CARRO/CAMIONETA">CARRO/CAMIONETA</option>
            <option value="MOTO">MOTO</option>
          </select>
        </div>
        <div class="form-group">
          <label>Placa</label>
          <input type="text" id="fPlaca" required placeholder="Ej. AA761KL o S/P" />
        </div>
        <div class="form-group">
          <label>Marca / Modelo</label>
          <input type="text" id="fMarca" required placeholder="Ej. HONDA CIVIC" />
        </div>
        <div class="form-group">
          <label>Color</label>
          <input type="text" id="fColor" required placeholder="Ej. DORADO" />
        </div>
        <div class="form-group">
          <label>Número Telefónico</label>
          <input type="text" id="fTelefono" placeholder="Ej. 0412-9613485" />
        </div>
        <div class="actions" style="margin-top:14px;">
          <button type="button" class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>
          <button type="submit" class="btn btn-success">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import {
      getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, getDocs
    } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const PIN_EDICION = "232387";

    const firebaseConfig = {
      apiKey: "AIzaSyCLluu7vNDbWUlQN67CAtX30ecSCaKCBD0",
      authDomain: "control-vehicular-b2df2.firebaseapp.com",
      databaseURL: "https://control-vehicular-b2df2-default-rtdb.firebaseio.com",
      projectId: "control-vehicular-b2df2",
      storageBucket: "control-vehicular-b2df2.firebasestorage.app",
      messagingSenderId: "162573164540",
      appId: "1:162573164540:web:61f4aca5a2e10805b09c79",
      measurementId: "G-FV8E9Y9VG7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const colRef = collection(db, "vehiculos");

    let vehiculos = [];
    let tabActual = "todos";
    let accionPendiente = null;
    let edicionDesbloqueada = sessionStorage.getItem("edit_auth") === "1";
    const gruposAbiertos = new Set();

    function getOwnerKey(v) {
      return `${(v.apto || "").trim()}|${(v.propietario || "").trim().toLowerCase()}`;
    }

    function escapeAttr(obj) {
      return JSON.stringify(obj).replace(/'/g, "&#39;").replace(/"/g, "&quot;");
    }

    function actualizarIndicadorEdicion() {
      const badge = document.getElementById("editModeBadge");
      const btn = document.getElementById("toggleEditBtn");
      if (edicionDesbloqueada) {
        badge.textContent = "Edición activa";
        badge.classList.add("unlocked");
        btn.textContent = "Bloquear PIN";
      } else {
        badge.textContent = "Modo consulta";
        badge.classList.remove("unlocked");
        btn.textContent = "Desbloquear PIN";
      }
    }

    function requerirPinEdicion(fn) {
      if (edicionDesbloqueada) {
        fn();
        return;
      }
      accionPendiente = fn;
      document.getElementById("editPinInput").value = "";
      document.getElementById("editPinError").textContent = "";
      document.getElementById("pinModal").classList.add("open");
      setTimeout(() => document.getElementById("editPinInput").focus(), 50);
    }

    window.toggleModoEdicion = () => {
      if (edicionDesbloqueada) {
        edicionDesbloqueada = false;
        sessionStorage.removeItem("edit_auth");
        actualizarIndicadorEdicion();
      } else {
        requerirPinEdicion(() => {});
      }
    };

    window.cerrarPinModal = () => {
      accionPendiente = null;
      document.getElementById("pinModal").classList.remove("open");
    };

    window.confirmarPinEdicion = () => {
      const ingresado = document.getElementById("editPinInput").value.trim();
      if (ingresado === PIN_EDICION) {
        edicionDesbloqueada = true;
        sessionStorage.setItem("edit_auth", "1");
        actualizarIndicadorEdicion();
        const fn = accionPendiente;
        cerrarPinModal();
        if (typeof fn === "function") fn();
      } else {
        document.getElementById("editPinError").textContent = "PIN incorrecto.";
      }
    };

    window.toggleGrupoVehiculos = (keyEncoded, cardId) => {
      const key = decodeURIComponent(keyEncoded);
      if (gruposAbiertos.has(key)) {
        gruposAbiertos.delete(key);
      } else {
        gruposAbiertos.add(key);
      }
      const listEl = document.getElementById(`multi-${cardId}`);
      const arrowEl = document.getElementById(`arrow-${cardId}`);
      if (listEl) {
        const isOpen = gruposAbiertos.has(key);
        listEl.classList.toggle("open", isOpen);
        if (arrowEl) arrowEl.textContent = isOpen ? "▲" : "▼";
      }
    };

    actualizarIndicadorEdicion();

    onSnapshot(colRef, (snapshot) => {
      vehiculos = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      document.getElementById("syncStatus").textContent = `Sincronizado en tiempo real (${vehiculos.length} registros)`;
      renderizar();
    }, (err) => {
      document.getElementById("syncStatus").textContent = "Error de conexión con Firestore: " + err.message;
    });

    window.cambiarTab = (tab, el) => {
      tabActual = tab;
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      el.classList.add("active");
      renderizar();
    };

    window.renderizar = () => {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const byKey = {};
      const typesByKey = {};

      vehiculos.forEach(v => {
        const key = getOwnerKey(v);
        byKey[key] = byKey[key] || [];
        byKey[key].push(v);

        typesByKey[key] = typesByKey[key] || new Set();
        typesByKey[key].add((v.tipo || "").toUpperCase().includes("MOTO") ? "MOTO" : "CARRO");
      });

      let filtrados = vehiculos.filter(v => {
        const key = getOwnerKey(v);
        const esMoto = (v.tipo || "").toUpperCase().includes("MOTO");
        const tieneMulti = (byKey[key] || []).length > 1;
        const tieneMixto = typesByKey[key] && typesByKey[key].size > 1;

        if (tabActual === "carro" && esMoto) return false;
        if (tabActual === "moto" && !esMoto) return false;
        if (tabActual === "multi" && !tieneMulti) return false;
        if (tabActual === "mixto" && !tieneMixto) return false;

        if (!q) return true;
        const texto = `${v.apto} ${v.propietario} ${v.tipo} ${v.placa} ${v.marca} ${v.color} ${v.telefono}`.toLowerCase();
        return texto.includes(q);
      });

      filtrados.sort((a, b) => String(a.apto).localeCompare(String(b.apto), undefined, { numeric: true }));

      document.getElementById("statsBar").innerHTML =
        `<span>Mostrando: <strong>${filtrados.length}</strong></span>` +
        `<span>Total base: <strong>${vehiculos.length}</strong></span>`;

      const cont = document.getElementById("resultsContainer");
      if (filtrados.length === 0) {
        cont.innerHTML = `
          <div class="alert-unregistered">
            <h3>Vehículo NO registrado</h3>
            <p>No se encontraron coincidencias para "${q || tabActual}" en el censo actual.</p>
            <button class="btn btn-primary" onclick="solicitarNuevo('${q.toUpperCase()}')">+ Registrar este vehículo</button>
          </div>`;
        return;
      }

      cont.innerHTML = `<div class="grid">` + filtrados.map((v, idx) => {
        const key = getOwnerKey(v);
        const grupo = byKey[key] || [v];
        const otros = grupo.filter(item => item.id !== v.id);
        const cardId = `${v.id || idx}_${idx}`;
        const isOpen = gruposAbiertos.has(key);

        const desplegableHtml = otros.length > 0 ? `
          <div class="multi-box">
            <button
              type="button"
              class="multi-toggle"
              onclick="toggleGrupoVehiculos('${encodeURIComponent(key)}', '${cardId}')"
            >
              <span>Ver los ${grupo.length} vehículos del apto/propietario</span>
              <span id="arrow-${cardId}">${isOpen ? "▲" : "▼"}</span>
            </button>
            <div class="multi-list ${isOpen ? "open" : ""}" id="multi-${cardId}">
              ${otros.map(o => `
                <div class="multi-item">
                  <div>
                    <div><strong>${o.placa || "S/P"}</strong> · ${o.marca \vert{}\vert{} "-"} (${o.color || "-"})</div>
                    <div class="multi-item-sub">${o.tipo || ""}</div>
                  </div>
                  <div class="mini-actions">
                    <button type="button" class="mini-btn btn-warn" onclick='solicitarEditar(${escapeAttr(o)})'>Editar</button>
                    <button type="button" class="mini-btn btn-danger" onclick="solicitarEliminar('${o.id}', '${(o.placa || o.marca || "").replace(/'/g, "")}')">×</button>
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        ` : "";

        return `
          <div class="card">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
                <span class="placa">${v.placa || "S/P"}</span>
                <span class="badge">Apto ${v.apto || "-"} · ${v.tipo || ""}</span>
              </div>
              <div class="meta" style="margin-top:8px;">
                <div><span>Marca/Modelo:</span> <strong>${v.marca || "-"}</strong> (${v.color || "-"})</div>
                <div><span>Copropietario:</span> ${v.propietario || "-"}</div>
                <div><span>Teléfono:</span> ${v.telefono || "No registrado"}</div>
              </div>
              ${desplegableHtml}
            </div>
            <div class="actions">
              <button class="btn btn-warn" onclick='solicitarEditar(${escapeAttr(v)})'>Editar</button>
              <button class="btn btn-danger" onclick="solicitarEliminar('${v.id}', '${(v.placa || v.marca || "").replace(/'/g, "")}')">Eliminar</button>
            </div>
          </div>`;
      }).join("") + `</div>`;
    };

    function abrirModal(prefillPlaca = "") {
      document.getElementById("modalTitle").textContent = "Registrar vehículo";
      document.getElementById("docId").value = "";
      document.getElementById("fApto").value = "";
      document.getElementById("fPropietario").value = "";
      document.getElementById("fTipo").value = "CARRO/CAMIONETA";
      document.getElementById("fPlaca").value = prefillPlaca;
      document.getElementById("fMarca").value = "";
      document.getElementById("fColor").value = "";
      document.getElementById("fTelefono").value = "";
      document.getElementById("formModal").classList.add("open");
    }

    function editarVehiculo(v) {
      document.getElementById("modalTitle").textContent = "Modificar vehículo";
      document.getElementById("docId").value = v.id;
      document.getElementById("fApto").value = v.apto || "";
      document.getElementById("fPropietario").value = v.propietario || "";
      document.getElementById("fTipo").value = (v.tipo || "").toUpperCase().includes("MOTO") ? "MOTO" : "CARRO/CAMIONETA";
      document.getElementById("fPlaca").value = v.placa || "";
      document.getElementById("fMarca").value = v.marca || "";
      document.getElementById("fColor").value = v.color || "";
      document.getElementById("fTelefono").value = v.telefono || "";
      document.getElementById("formModal").classList.add("open");
    }

    window.solicitarNuevo = (prefillPlaca = "") => {
      requerirPinEdicion(() => abrirModal(prefillPlaca));
    };

    window.solicitarEditar = (v) => {
      requerirPinEdicion(() => editarVehiculo(v));
    };

    window.solicitarEliminar = (id, label) => {
      requerirPinEdicion(async () => {
        if (confirm(`¿Eliminar definitivamente el registro "${label}"?`)) {
          await deleteDoc(doc(db, "vehiculos", id));
        }
      });
    };

    window.solicitarCenso = () => {
      requerirPinEdicion(() => cargarCensoInicial());
    };

    window.cerrarModal = () => document.getElementById("formModal").classList.remove("open");

    window.guardarVehiculo = async (e) => {
      e.preventDefault();
      requerirPinEdicion(async () => {
        const id = document.getElementById("docId").value;
        const data = {
          apto: document.getElementById("fApto").value.trim(),
          propietario: document.getElementById("fPropietario").value.trim(),
          tipo: document.getElementById("fTipo").value.trim(),
          placa: document.getElementById("fPlaca").value.trim().toUpperCase(),
          marca: document.getElementById("fMarca").value.trim().toUpperCase(),
          color: document.getElementById("fColor").value.trim().toUpperCase(),
          telefono: document.getElementById("fTelefono").value.trim()
        };
        if (id) {
          await updateDoc(doc(db, "vehiculos", id), data);
        } else {
          await addDoc(colRef, data);
        }
        cerrarModal();
      });
    };

    const CENSO_OCTUBRE_2026 = [
      { apto: "3", propietario: "German Josep", tipo: "CARRO/CAMIONETA", placa: "AC128AN", marca: "DF5K", color: "GRIS", telefono: "0416-8219600" },
      { apto: "101", propietario: "Arnaldo Hernandez", tipo: "CARRO/CAMIONETA", placa: "SBE37C", marca: "TOYOTA MERU", color: "BLANCO", telefono: "0424-1325740" },
      { apto: "101", propietario: "Arnaldo Hernandez", tipo: "CARRO/CAMIONETA", placa: "A76AA7G", marca: "MAZDA PICK-UP", color: "BEIGE", telefono: "0424-1325740" },
